<script>
(function() {
  'use strict';

  var endTaskModal = document.getElementById('endTaskModal');
  var reasonBlock = document.getElementById('reasonBlock');
  var notOutReason = document.getElementById('notOutReason');
  var currentChoice = 'out';

  // Open end-task modal
  document.getElementById('btnEndTask').addEventListener('click', function() {
    // 每次打开重置为「已出车」并收起原因输入
    currentChoice = 'out';
    notOutReason.value = '';
    document.querySelectorAll('#endOptions .end-option').forEach(function(o) {
      o.classList.toggle('selected', o.getAttribute('data-choice') === 'out');
    });
    reasonBlock.style.display = 'none';
    endTaskModal.classList.add('show');
  });

  // Choice radio switch
  document.querySelectorAll('#endOptions .end-option').forEach(function(opt) {
    opt.addEventListener('click', function() {
      document.querySelectorAll('#endOptions .end-option').forEach(function(o) {
        o.classList.remove('selected');
      });
      this.classList.add('selected');
      currentChoice = this.getAttribute('data-choice');
      if (currentChoice === 'notout') {
        reasonBlock.style.display = 'block';
        notOutReason.focus();
      } else {
        reasonBlock.style.display = 'none';
        notOutReason.value = '';
      }
    });
  });

  // Confirm end
  document.getElementById('endConfirmBtn').addEventListener('click', function() {
    if (currentChoice === 'notout') {
      var reason = notOutReason.value.trim();
      if (!reason) {
        MS.showToast('请填写未出车原因', 'error');
        notOutReason.focus();
        return;
      }
      endTaskModal.classList.remove('show');
      MS.showToast('已记录未出车，任务关闭', 'info');
    } else {
      endTaskModal.classList.remove('show');
      MS.showToast('任务已完成', 'success');
    }
  });

  // Modal mask close
  endTaskModal.addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });

})();
</script>
