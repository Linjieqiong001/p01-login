<style>
/* ==================== 状态标签配色 ==================== */
.tag-pass { background: var(--success-light); color: var(--success); }   /* 通过=绿 */
.tag-reject { background: var(--danger-light); color: var(--danger); }    /* 驳回=红 */
.tag-pending { background: var(--warning-light); color: var(--warning); }  /* 待处理=橙 */
.status-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}

/* ==================== Detail Info Row（参考 P27） ==================== */
.detail-block {
  padding: 4px 16px 14px;
}
.detail-row {
  display: flex;
  align-items: flex-start;
  padding: 8px 0;
  gap: 12px;
}
.detail-row .d-label {
  font-size: 13px;
  color: var(--text-3);
  width: 70px;
  flex-shrink: 0;
  padding-top: 1px;
}
.detail-row .d-value {
  font-size: 14px;
  color: var(--text-1);
  flex: 1;
  line-height: 1.5;
}

/* ==================== 申请编号区 ==================== */
.apply-number-section {
  background: var(--primary-gradient);
  margin: 16px 16px 0;
  border-radius: var(--radius-lg);
  padding: 18px 16px;
  color: #FFFFFF;
  box-shadow: 0 4px 12px rgba(22,119,255,0.25);
  display: flex;
  align-items: center;
  gap: 12px;
}
.apply-number-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.apply-number-icon svg { width: 22px; height: 22px; color: #FFFFFF; }
.apply-number-info { flex: 1; min-width: 0; }
.apply-number-label { font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
.apply-number-value { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }

/* ==================== 佐证材料缩略图 ==================== */
.evidence-photos {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 4px 0 0;
}
.evidence-photo {
  width: 72px;
  height: 72px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  position: relative;
}
.evidence-photo .photo-thumb {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #E6F0FF, #1677FF);
  display: flex;
  align-items: center;
  justify-content: center;
}
.evidence-photo .photo-thumb svg { width: 28px; height: 28px; color: rgba(255,255,255,0.9); }
.evidence-photo .photo-num {
  position: absolute;
  bottom: 2px;
  right: 2px;
  font-size: 10px;
  color: #FFFFFF;
  background: rgba(0,0,0,0.4);
  border-radius: 3px;
  padding: 1px 4px;
}
.evidence-photo:active { opacity: 0.85; }

/* ==================== 图片预览弹窗 ==================== */
.photo-preview-area {
  width: 100%;
  height: 240px;
  background: linear-gradient(135deg, #E6F0FF, #1677FF);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
}
.photo-preview-area svg { width: 64px; height: 64px; color: rgba(255,255,255,0.85); }
.photo-preview-caption {
  text-align: center;
  font-size: 13px;
  color: var(--text-3);
  margin-top: 12px;
}

.spacer { height: 30px; }
</style>
</head>

<script>
(function() {
  'use strict';

  var toastTimer = null;
  function showToast(text, iconType) {
    var toast = document.getElementById('toast');
    var toastText = document.getElementById('toastText');
    var toastIcon = toast.querySelector('.toast-icon');

    toastText.textContent = text;

    var iconHtml = '';
    if (iconType === 'success') {
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
    } else if (iconType === 'error') {
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
    } else {
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
    }
    toastIcon.innerHTML = iconHtml;

    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toast.classList.remove('show');
    }, 1800);
  }

  // 佐证材料图片点击 → 大图预览
  var previewModal = document.getElementById('photoPreviewModal');
  var previewCaption = document.getElementById('previewCaption');

  document.querySelectorAll('.evidence-photo').forEach(function(item) {
    item.addEventListener('click', function() {
      var idx = this.getAttribute('data-idx');
      previewCaption.textContent = '佐证材料 ' + idx;
      previewModal.classList.add('show');
    });
  });

  // 关闭预览
  document.getElementById('closePreview').addEventListener('click', function() {
    previewModal.classList.remove('show');
  });

  // Status bar time
  function updateStatusTime() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var el = document.querySelector('.status-bar .time');
    if (el) el.textContent = h + ':' + m;
  }
  updateStatusTime();
  setInterval(updateStatusTime, 60000);

})();
</script>
