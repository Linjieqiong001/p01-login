/* Step current line color */
.step.current::before { background: var(--primary); }

/* Status banner */
.status-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  margin: 12px 16px 0;
  border-radius: var(--radius-lg);
  background: var(--primary-light);
}
.status-banner .status-icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--primary-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.status-banner .status-icon svg { width: 22px; height: 22px; color: #FFFFFF; }
.status-banner .status-text { font-size: 16px; font-weight: 600; color: var(--primary); }
.status-banner .status-desc { font-size: 12px; color: var(--text-2); margin-top: 2px; }

/* Steps section */
.steps-section {
  background: var(--card-bg);
  margin: 12px 16px 0;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.steps-section .steps { margin: 0; padding: 20px 16px; }

/* Phone link */
.phone-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--primary);
  font-weight: 600;
  cursor: pointer;
}
.phone-link svg { width: 14px; height: 14px; }
.phone-link:active { opacity: 0.7; }

/* Approval result tag */
.result-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  background: var(--success-light);
  color: var(--success);
}
.result-tag svg { width: 12px; height: 12px; }

/* Call driver button */
.call-btn-wrap {
  padding: 0 16px 14px;
}
.call-btn-wrap .btn {
  gap: 6px;
}

/* Section with no top margin (after banner) */
.section.first { margin-top: 12px; }

/* Flow timeline (reference: approval process screenshot) */
.flow-timeline {
  padding: 8px 16px 16px;
}
.flow-node {
  display: flex;
  align-items: flex-start;
  position: relative;
  padding: 12px 0;
}
.flow-node:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 19px;
  top: 52px;
  bottom: -4px;
  width: 2px;
  background: var(--border);
}
.flow-avatar {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: var(--primary-gradient);
  color: #FFFFFF;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.flow-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.flow-status {
  position: absolute;
  right: -4px;
  bottom: -4px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--success);
  border: 2px solid #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
}
.flow-status svg {
  width: 10px;
  height: 10px;
  color: #FFFFFF;
}
.flow-status.pending {
  background: var(--warning);
}
.flow-body {
  flex: 1;
  margin-left: 12px;
  min-width: 0;
}
.flow-meta {
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.4;
}
.flow-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-1);
  line-height: 1.5;
  margin-top: 2px;
}
.flow-time {
  font-size: 12px;
  color: var(--text-3);
  flex-shrink: 0;
  margin-left: 8px;
  line-height: 1.4;
}

/* Content bottom padding */
.content { padding-bottom: 20px; }
</style>
