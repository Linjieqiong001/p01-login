<style>
/* ==================== Housing Info Card ==================== */
.housing-card {
  background: var(--card-bg);
  margin: 12px 16px 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
}

.housing-img {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: linear-gradient(150deg, #4D9FFF 0%, #1677FF 30%, #0052D9 60%, #003399 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* Decorative elements */
.housing-img::before {
  content: '';
  position: absolute;
  top: -30%;
  right: -10%;
  width: 60%;
  height: 80%;
  background: radial-gradient(ellipse, rgba(255,255,255,0.1) 0%, transparent 70%);
  border-radius: 50%;
}

.housing-img::after {
  content: '';
  position: absolute;
  bottom: -20%;
  left: -10%;
  width: 50%;
  height: 60%;
  background: radial-gradient(ellipse, rgba(255,255,255,0.06) 0%, transparent 70%);
  border-radius: 50%;
}

.housing-img-tag {
  position: absolute;
  top: 10px;
  left: 12px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #FFFFFF;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 12px;
  letter-spacing: 0.5px;
}

.housing-img svg {
  width: 80px;
  height: 80px;
  opacity: 0.3;
  position: relative;
  z-index: 1;
}

.housing-info {
  padding: 14px 16px;
}

.housing-address {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}

.housing-address .community {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-1);
}

.housing-address .tag {
  font-size: 10px;
  background: var(--primary-light);
  color: var(--primary);
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 500;
}

.housing-details {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 0;
}

.housing-detail-item {
  width: 50%;
  display: flex;
  align-items: center;
  gap: 6px;
}

.housing-detail-item .label {
  font-size: 12px;
  color: var(--text-3);
  min-width: 52px;
}

.housing-detail-item .value {
  font-size: 13px;
  color: var(--text-1);
  font-weight: 500;
}

.housing-detail-item .value.rent {
  color: var(--danger);
  font-weight: 700;
  font-size: 15px;
}

/* ==================== Function Grid ==================== */
.func-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  background: var(--card-bg);
  margin: 12px 16px 0;
  border-radius: var(--radius-lg);
  padding: 16px 4px;
  box-shadow: var(--shadow-sm);
}

.func-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  cursor: pointer;
  transition: transform 0.15s;
}

.func-item:active {
  transform: scale(0.92);
}

.func-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.func-icon svg {
  width: 24px;
  height: 24px;
}

.func-1 { background: linear-gradient(135deg, #5DADE2, #3498DB); }
.func-2 { background: linear-gradient(135deg, #F1948A, #E74C3C); }
.func-3 { background: linear-gradient(135deg, #FFB443, #FF9800); }
.func-4 { background: linear-gradient(135deg, #58D68D, #27AE60); }
.func-1 svg, .func-2 svg, .func-3 svg, .func-4 svg { color: #FFFFFF; }

.func-label {
  font-size: 12px;
  color: var(--text-2);
  text-align: center;
}

/* ==================== Announcement Section ==================== */
.announce-section {
  background: var(--card-bg);
  margin: 12px 16px 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.announce-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 8px;
}

.announce-title-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}

.announce-dot {
  width: 4px;
  height: 14px;
  background: var(--primary);
  border-radius: 2px;
}

.announce-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
}

.announce-more {
  font-size: 12px;
  color: var(--text-3);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 2px;
}

.announce-more svg {
  width: 14px;
  height: 14px;
}

.announce-more:active {
  color: var(--primary);
}

.announce-list {
  padding: 0 16px 12px;
}

.announce-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--border);
  cursor: pointer;
  transition: background 0.2s;
}

.announce-item:last-child {
  border-bottom: none;
}

.announce-item:active {
  opacity: 0.7;
}

.announce-item-title {
  font-size: 13px;
  color: var(--text-1);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-right: 12px;
}

.announce-item-time {
  font-size: 11px;
  color: var(--text-4);
  flex-shrink: 0;
}

/* Bottom spacer for scroll */
.bottom-spacer {
  height: 20px;
}
</style>
</head>

<script>
(function() {
  'use strict';

  // ==================== Function Grid Click Handlers ====================
  var funcItems = document.querySelectorAll('.func-item');
  funcItems.forEach(function(item) {
    item.addEventListener('click', function() {
      var action = this.getAttribute('data-action');
      if (action === 'apply') {
        window.location.href = 'P18-housing-apply.html';
      } else if (action === 'checkout') {
        window.location.href = 'P18-housing-apply.html';
      } else if (action === 'repair') {
        window.location.href = 'P19-housing-repair.html';
      } else if (action === 'furniture') {
        MS.showToast('跳转家具清单页', 'info');
      }
    });
  });

  // ==================== View All Announcements ====================
  var moreBtn = document.querySelector('.announce-more');
  moreBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    MS.showToast('查看全部住房公告', 'info');
  });

  // ==================== Announcement Items Click ====================
  var announceItems = document.querySelectorAll('.announce-item');
  announceItems.forEach(function(item, index) {
    item.addEventListener('click', function() {
