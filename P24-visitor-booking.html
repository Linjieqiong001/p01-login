<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P24 - 访客预约</title>
<link rel="stylesheet" href="common.css">
<style>
.companion-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.companion-input {
  flex: 1;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0 12px;
  font-size: 14px;
  color: var(--text-1);
  background: var(--bg);
  outline: none;
  font-family: inherit;
  transition: border-color 0.2s;
}
.companion-input:focus { border-color: var(--primary); }
.companion-input::placeholder { color: var(--text-4); }
.companion-delete {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--danger-light);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s;
  flex-shrink: 0;
}
.companion-delete:active { transform: scale(0.9); }
.companion-delete svg { width: 14px; height: 14px; color: var(--danger); }

.add-companion-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 0;
  font-size: 13px;
  color: var(--primary);
  cursor: pointer;
  font-weight: 500;
}
.add-companion-btn:active { opacity: 0.7; }
.add-companion-btn svg { width: 16px; height: 16px; }

.form-item.date-item {
  cursor: pointer;
}
.date-display {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: 1;
}
.date-display .date-text {
  font-size: 14px;
  color: var(--text-4);
}
.date-display .date-text.has-value {
  color: var(--text-1);
}

.section-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 14px 16px 4px;
}
.section-header .dot {
  width: 4px;
  height: 14px;
  background: var(--primary);
  border-radius: 2px;
}
.section-header .section-label {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
}

.btn-fixed-bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 16px calc(12px + var(--safe-bottom));
  background: var(--card-bg);
  border-top: 0.5px solid var(--divider);
}
.btn-fixed-bottom .btn { width: 100%; }

.form-textarea-wrap {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.form-textarea {
  width: 100%;
  border: none;
  outline: none;
  font-size: 14px;
  color: var(--text-1);
  background: transparent;
  resize: none;
  min-height: 80px;
  font-family: inherit;
  line-height: 1.5;
}
.form-textarea::placeholder { color: var(--text-4); }
</style>
</head>
<body>
<div class="miniprogram">
  <div class="status-bar light"><span class="time">09:38</span><div class="icons"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33V20.67C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg></div></div>
  <div class="nav-bar white">
    <div class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
    <span class="nav-title">访客预约</span>
    <span class="nav-placeholder"></span>
  </div>
  <div class="content">

    <!-- 基本信息 -->
    <div class="section">
      <div class="section-header">
        <div class="dot"></div>
        <div class="section-label">基本信息</div>
      </div>
      <div class="form-group">
        <div class="form-item">
          <div class="form-label"><span class="required">*</span>访客姓名</div>
          <div class="form-value">
            <input class="form-input" type="text" placeholder="请输入访客姓名" id="visitorName">
          </div>
        </div>
        <div class="form-item">
          <div class="form-label"><span class="required">*</span>手机号</div>
          <div class="form-value">
            <input class="form-input" type="tel" placeholder="请输入手机号" id="visitorPhone" maxlength="11">
          </div>
        </div>
        <div class="form-item date-item" id="dateItem">
          <div class="form-label"><span class="required">*</span>来访时间</div>
          <div class="form-value">
            <div class="date-display">
              <span class="date-text" id="dateText">请选择来访时间</span>
              <svg class="form-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
        </div>
        <div class="form-item">
          <div class="form-label"><span class="required">*</span>事由</div>
          <div class="form-value">
            <div class="form-textarea-wrap">
              <textarea class="form-textarea" placeholder="请输入来访事由" id="visitReason"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 随行人员 -->
    <div class="section">
      <div class="section-header">
        <div class="dot"></div>
        <div class="section-label">随行人员</div>
      </div>
      <div class="form-group">
        <div id="companionList">
          <div class="companion-item" data-idx="0">
            <input class="companion-input" type="text" placeholder="请输入随行人员姓名">
            <div class="companion-delete" onclick="removeCompanion(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </div>
          </div>
          <div class="companion-item" data-idx="1">
            <input class="companion-input" type="text" placeholder="请输入随行人员姓名">
            <div class="companion-delete" onclick="removeCompanion(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </div>
          </div>
        </div>
        <div class="add-companion-btn" id="addCompanionBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          添加随行人员
        </div>
      </div>
    </div>

    <!-- 其他选项 -->
    <div class="section">
      <div class="section-header">
        <div class="dot"></div>
        <div class="section-label">其他选项</div>
      </div>
      <div class="form-group">
        <div class="form-item">
          <div class="form-label">预留车位</div>
          <div class="form-value flex-between">
            <span style="font-size:13px;color:var(--text-3);">是否需要预留停车位</span>
            <label class="switch">
              <input type="checkbox" id="parkingSwitch">
              <div class="switch-slider"></div>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部间距，给fixed bottom按钮留空间 -->
    <div style="height: 80px;"></div>
  </div>

  <!-- 底部提交按钮 -->
  <div class="btn-fixed-bottom">
    <button class="btn btn-primary" id="submitBtn">提交预约</button>
  </div>
</div>
<script src="common.js"></script>
<script>
// 随行人员管理
var companionCount = 2;

function removeCompanion(btn) {
  var item = btn.parentElement;
  var list = document.getElementById('companionList');
  if (list.children.length <= 1) {
    MS.showToast('至少保留一个随行人员输入框', 'info');
    return;
  }
  item.style.opacity = '0';
  item.style.transform = 'translateX(20px)';
  item.style.transition = 'all 0.25s';
  setTimeout(function() {
    item.remove();
    companionCount--;
  }, 250);
}

document.getElementById('addCompanionBtn').addEventListener('click', function() {
  if (companionCount >= 5) {
    MS.showToast('最多添加5位随行人员', 'info');
    return;
  }
  companionCount++;
  var item = document.createElement('div');
  item.className = 'companion-item';
  item.setAttribute('data-idx', companionCount - 1);
  item.innerHTML = '<input class="companion-input" type="text" placeholder="请输入随行人员姓名"><div class="companion-delete" onclick="removeCompanion(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></div>';
  item.style.opacity = '0';
  item.style.transform = 'translateX(-20px)';
  document.getElementById('companionList').appendChild(item);
  requestAnimationFrame(function() {
    item.style.transition = 'all 0.25s';
    item.style.opacity = '1';
    item.style.transform = 'translateX(0)';
  });
});

// 日期选择模拟
var dateOptions = [
  '2026-07-22 09:00',
  '2026-07-22 10:00',
  '2026-07-22 14:00',
  '2026-07-22 15:00',
  '2026-07-23 09:00',
  '2026-07-23 10:00',
  '2026-07-23 14:00'
];
var currentDateIdx = -1;

document.getElementById('dateItem').addEventListener('click', function() {
  currentDateIdx++;
  if (currentDateIdx >= dateOptions.length) currentDateIdx = 0;
  var dateText = document.getElementById('dateText');
  dateText.textContent = dateOptions[currentDateIdx];
  dateText.classList.add('has-value');
});

// 提交
document.getElementById('submitBtn').addEventListener('click', function() {
  var name = document.getElementById('visitorName').value.trim();
  var phone = document.getElementById('visitorPhone').value.trim();
  var date = document.getElementById('dateText').textContent;
  var reason = document.getElementById('visitReason').value.trim();

  if (!name) {
    MS.showToast('请输入访客姓名', 'info');
    return;
  }
  if (!phone) {
    MS.showToast('请输入手机号', 'info');
    return;
  }
  if (date === '请选择来访时间') {
    MS.showToast('请选择来访时间', 'info');
    return;
  }
  if (!reason) {
    MS.showToast('请输入来访事由', 'info');
    return;
  }

  MS.showToast('预约成功，已通知被访人', 'success');
});
</script>
</body>
</html>
