/* ==================== Room Info Card (Readonly) ==================== */
.room-info-card {
  background: #F7F8FC;
  margin: 12px 16px 0;
  border-radius: var(--radius-lg);
  padding: 16px;
  position: relative;
  box-shadow: var(--shadow-sm);
}

.room-info-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.room-info-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(135deg, #E6F0FF, #B3D4FF);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.room-info-icon svg {
  width: 22px;
  height: 22px;
  color: var(--primary);
}

.room-info-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
}

.room-info-subtitle {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 2px;
}

.room-info-rows {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.room-info-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
}

.room-info-row .ri-label {
  font-size: 13px;
  color: var(--text-3);
  min-width: 44px;
}

.room-info-row .ri-value {
  font-size: 14px;
  color: var(--text-1);
  font-weight: 500;
}

.room-info-hint {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 0.5px dashed var(--divider);
}

.room-info-hint svg {
  width: 14px;
  height: 14px;
  color: var(--text-4);
  flex-shrink: 0;
}

.room-info-hint span {
  font-size: 11px;
  color: var(--text-4);
}

/* ==================== Form Section ==================== */
.form-section {
  background: var(--card-bg);
  margin: 12px 16px 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.form-group {
  padding: 0 16px;
}

.form-item {
  display: flex;
  align-items: flex-start;
  padding: 14px 0;
  border-bottom: 0.5px solid var(--border);
  gap: 10px;
}

.form-item:last-child {
  border-bottom: none;
}

.form-label {
  font-size: 14px;
  color: var(--text-1);
  font-weight: 500;
  min-width: 74px;
  padding-top: 2px;
  flex-shrink: 0;
}

.form-label .required {
  color: var(--danger);
  margin-right: 2px;
}

.form-body {
  flex: 1;
  min-width: 0;
}

.form-select {
  width: 100%;
  border: none;
  outline: none;
  font-size: 14px;
  color: var(--text-1);
  background: transparent;
  appearance: none;
  -webkit-appearance: none;
  font-family: inherit;
  cursor: pointer;
  padding: 2px 0;
  line-height: 1.5;
}

.form-select option {
  color: var(--text-1);
}

.form-textarea {
  width: 100%;
  border: none;
  outline: none;
  font-size: 14px;
  color: var(--text-1);
  background: transparent;
  resize: none;
  min-height: 80px;
  font-family: inherit;
  line-height: 1.5;
  padding: 0;
}

.form-textarea::placeholder {
  color: var(--text-4);
}

/* ==================== Photo Upload ==================== */
.photo-upload {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 4px 0;
}

.photo-item {
  width: 72px;
  height: 72px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  position: relative;
  background: linear-gradient(135deg, #FFF3E0, #FFE0B2);
  display: flex;
  align-items: center;
  justify-content: center;
}

.photo-item svg {
  width: 28px;
  height: 28px;
  color: rgba(255,255,255,0.7);
}

.photo-add {
  width: 72px;
  height: 72px;
  border-radius: var(--radius-sm);
  border: 1.5px dashed var(--divider);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  background: var(--bg);
  transition: border-color 0.2s;
}

.photo-add:active {
  border-color: var(--primary);
}

.photo-add svg {
  width: 22px;
  height: 22px;
  color: var(--text-4);
}

.photo-add span {
  font-size: 10px;
  color: var(--text-4);
}

.photo-delete {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 18px;
  height: 18px;
  background: rgba(0,0,0,0.5);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.photo-delete svg {
  width: 10px;
  height: 10px;
  color: #FFFFFF;
}

.upload-hint {
  font-size: 11px;
  color: var(--text-4);
  padding-top: 4px;
}

/* ==================== Submit Button Area ==================== */
.submit-area {

}

.submit-area .btn {

  height: 46px;
  background: var(--primary-gradient);
  color: #FFFFFF;
  border: none;
  border-radius: var(--radius-md);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  font-family: inherit;
}

.submit-area .btn:active {
  transform: scale(0.98);
  opacity: 0.85;
}

/* ==================== Toast ==================== */
.toast {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  background: rgba(0,0,0,0.75);
  color: #FFFFFF;
  padding: 12px 24px;
  border-radius: var(--radius-md);
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  transition: all 0.2s;
  white-space: nowrap;
  max-width: 320px;
  text-align: center;
  line-height: 1.5;
}

.toast.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -50%) scale(1);
}

.toast .toast-icon {
  display: flex;
  justify-content: center;
  margin-bottom: 6px;
}

.toast .toast-icon svg {
  width: 32px;
  height: 32px;
}
</style>

<script>
(function() {
  'use strict';

  // ==================== History Record ====================
  document.getElementById('historyBtn').addEventListener('click', function() {
    window.location.href = 'P34-housing-records.html';
  });

  // ==================== Photo Upload ====================
  var uploadGroup = document.getElementById('uploadRepair');
  var addBtn = uploadGroup.querySelector('.photo-add');

  addBtn.addEventListener('click', function() {
    var count = uploadGroup.querySelectorAll('.photo-item').length;
    if (count >= 9) {
      MS.showToast('最多上传9张照片', 'info');
      return;
    }

    var hues = ['30', '50', '70', '90', '110', '130', '150', '170', '190'];
    var hue = hues[count % hues.length];

    var item = document.createElement('div');
    item.className = 'photo-item';
    item.innerHTML = '<div style="width:100%;height:100%;background:linear-gradient(135deg, hsl(' + hue + ',40%,90%), hsl(' + hue + ',50%,75%));display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div><div class="photo-delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></div>';

    item.querySelector('.photo-delete').addEventListener('click', function(e) {
      e.stopPropagation();
      item.remove();
    });

    uploadGroup.insertBefore(item, addBtn);
  });

  // ==================== Submit Button ====================
  var submitBtn = document.getElementById('submitBtn');
  submitBtn.addEventListener('click', function() {
    var repairType = document.getElementById('repairType');
    var selectedType = repairType.options[repairType.selectedIndex];

    // Generate work order number
    var now = new Date();
    var dateStr = '' + now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, '0') +
      String(now.getDate()).padStart(2, '0');
    var seq = String(Math.floor(Math.random() * 900) + 100);
    var workOrderNo = 'FW' + dateStr + seq;

    MS.showToast('报修工单已提交，工单号：' + workOrderNo, 'success');
  });

})();
</script>
