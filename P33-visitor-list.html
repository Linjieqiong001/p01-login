<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P33 - 今日访客列表</title>
<link rel="stylesheet" href="common.css">
<style>
.stat-hero {
  background: var(--primary-gradient);
  margin: 12px 16px 0;
  border-radius: var(--radius-lg);
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 12px rgba(22,119,255,0.25);
}
.stat-hero::before {
  content: '';
  position: absolute;
  top: -20px;
  right: -20px;
  width: 80px;
  height: 80px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.stat-hero::after {
  content: '';
  position: absolute;
  bottom: -30px;
  left: -10px;
  width: 60px;
  height: 60px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.stat-hero .hero-icon {
  width: 52px;
  height: 52px;
  background: rgba(255,255,255,0.2);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  backdrop-filter: blur(4px);
}
.stat-hero .hero-icon svg { width: 28px; height: 28px; color: #FFFFFF; }
.stat-hero .hero-info { flex: 1; z-index: 1; }
.stat-hero .hero-label { font-size: 13px; color: rgba(255,255,255,0.8); }
.stat-hero .hero-num { font-size: 36px; font-weight: 700; color: #FFFFFF; }
.stat-hero .hero-unit { font-size: 16px; color: rgba(255,255,255,0.7); font-weight: 400; }

.visitor-section-title {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 14px 16px 8px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
}
.visitor-section-title .dot {
  width: 4px;
  height: 14px;
  background: var(--primary);
  border-radius: 2px;
}

.visitor-card {
  background: var(--card-bg);
  margin: 8px 16px 0;
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s;
}
.visitor-card:active { transform: scale(0.99); }
.visitor-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.visitor-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--primary-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  font-size: 16px;
  font-weight: 600;
  flex-shrink: 0;
}
.visitor-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
}
.visitor-phone {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 2px;
}

.visitor-detail-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
}
.visitor-detail-item {
  width: 50%;
  display: flex;
  align-items: baseline;
  padding: 6px 0;
  font-size: 13px;
}
.visitor-detail-item .v-label {
  color: var(--text-3);
  min-width: 70px;
  flex-shrink: 0;
}
.visitor-detail-item .v-value {
  color: var(--text-1);
  flex: 1;
}
.visitor-detail-item .v-value.highlight {
  color: var(--primary);
  font-weight: 500;
}

.visitor-divider {
  height: 0.5px;
  background: var(--border);
  margin: 2px 0 6px;
}
</style>
</head>
