  <div class="image-preview-mask" id="imagePreviewMask" data-page-node-id="m8ineMzMrnmGCQbpRBtnPk">
    <div class="image-preview-close" onclick="closeImagePreview()" data-page-node-id="eLc6hvumbizHJaPXJeaZFi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-page-node-id="Dc7sl7Iu6vjGMfzRPiJTRf">
        <path d="M18 6L6 18M6 6l12 12" data-page-node-id="KnNq0yhFdrYoUVdbVX6Ctt"/>
      </svg>
    </div>
    <svg id="imagePreviewSvg" viewBox="0 0 24 24" width="120" height="120" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" data-page-node-id="yBR0jjQOZ7QqL29gFKlBJY">
      <rect x="3" y="3" width="18" height="18" rx="2" data-page-node-id="c3d1aIcLgeDBkwLbCEV5Wt"/><circle cx="8.5" cy="8.5" r="1.5" data-page-node-id="bh8CIGHSRrdCI793XKViZy"/><path d="M21 15l-5-5L5 21" data-page-node-id="LRXlSy0fXy41BbKOXmRopl"/>

  <div class="toast" id="toast" data-page-node-id="GpURYhOkIjyTZuaYzjbZ9Y">

<script src="common.js"></script>
<script>
(function() {
  'use strict';

  /* ==================== Toast ==================== */
  var toastTimer = null;
  function showToast(text, iconType) {
    var toast = document.getElementById('toast');
    var toastText = document.getElementById('toastText');
    var toastIcon = toast.querySelector('.toast-icon');

    toastText.textContent = text;
    var iconHtml = '';
    if (iconType === 'success') {
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
    } else if (iconType === 'error') {
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
    } else {
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
    }
    toastIcon.innerHTML = iconHtml;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toast.classList.remove('show');
    }, 2000);
  }

  /* ==================== Approve → Confirm Modal ==================== */
  document.getElementById('btnApprove').addEventListener('click', function() {
    document.getElementById('confirmModal').classList.add('show');
  });

  /* ==================== Confirm Approve → Assign Modal ==================== */
  document.getElementById('confirmApproveBtn').addEventListener('click', function() {
    document.getElementById('confirmModal').classList.remove('show');
    document.getElementById('assignModal').classList.add('show');
  });

  document.getElementById('assignConfirm').addEventListener('click', function() {
    var community = document.getElementById('assignCommunity');
    var building = document.getElementById('assignBuilding');
    var room = document.getElementById('assignRoom');

    if (!community.value.trim()) {
      showToast('请输入小区名称', 'error');
      community.focus();
      return;
    }
    if (!building.value.trim()) {
      showToast('请输入楼栋号', 'error');
      building.focus();
      return;
    }
    if (!room.value.trim()) {
      showToast('请输入房号', 'error');
      room.focus();
      return;
    }

    document.getElementById('assignModal').classList.remove('show');
    showToast('审批通过，已分配房源', 'success');
  });

  /* ==================== Reject Modal ==================== */
  document.getElementById('btnReject').addEventListener('click', function() {
    document.getElementById('rejectReason').value = '';
    document.getElementById('rejectModal').classList.add('show');
  });

  document.getElementById('rejectConfirm').addEventListener('click', function() {
    var reason = document.getElementById('rejectReason').value.trim();
    if (!reason) {
      showToast('请填写驳回原因', 'error');
      return;
    }
    document.getElementById('rejectModal').classList.remove('show');
    showToast('已驳回该申请', 'info');
  });

  /* ==================== Modal Mask Click to Close ==================== */
  document.querySelectorAll('.modal-mask').forEach(function(mask) {
    mask.addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('show');
    });
  });

  /* ==================== Image Preview ==================== */
  var imageData = [
    { name: '佐证材料-入住申请表', color1: '#E6F0FF', color2: '#1677FF' },
    { name: '佐证材料-身份证复印件', color1: '#FFF3E8', color2: '#ED7B2F' }
  ];

  window.openImagePreview = function(index) {
    var mask = document.getElementById('imagePreviewMask');
    var svg = document.getElementById('imagePreviewSvg');
    var label = document.getElementById('imagePreviewLabel');
    var data = imageData[index] || imageData[0];

    svg.style.display = '';
    label.textContent = data.name;
    mask.classList.add('show');
  };

  window.closeImagePreview = function() {
    document.getElementById('imagePreviewMask').classList.remove('show');
  };

  document.getElementById('imagePreviewMask').addEventListener('click', function(e) {
    if (e.target === this) closeImagePreview();
  });

  /* ==================== Status Bar Time ==================== */
  function updateStatusTime() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var el = document.querySelector('.status-bar .time');
    if (el) el.textContent = h + ':' + m;
  }
  updateStatusTime();
  setInterval(updateStatusTime, 60000);

})();
</script>

</body>
</html>
