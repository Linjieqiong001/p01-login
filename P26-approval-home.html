.module-header {

.stat-card-p26.all { background: var(--primary-light); }
.stat-card-p26.all .stat-num { color: var(--primary); }
.stat-card-p26.all .stat-label { color: var(--primary); }
.stat-card-p26.all:active { background: #CDE3FF; }

.spacer { height: 12px; }
</style>

<script>
(function() {
  'use strict';

  // Override toast to use inline toast elements
  var toastTimer = null;
  function showToast(text, iconType) {
    var toast = document.getElementById('toast');
    var toastText = document.getElementById('toastText');
    toastText.textContent = text;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toast.classList.remove('show');
    }, 1800);
  }

  // Init TabBar
  MS.initTabBar('审批');

  // Stat card click
  document.querySelectorAll('.stat-card-p26').forEach(function(card) {
    card.addEventListener('click', function() {
      var moduleName = this.closest('.stat-row-p26').getAttribute('data-module');
      var type = this.getAttribute('data-type');
      var typeLabel = type === 'pending' ? '待处理' : (type === 'done' ? '已处理' : '全部');
      var targetUrl = 'P29-approval-list.html';
      if (moduleName === '公车审批') {
        targetUrl = 'P36-car-approval-list.html';
      } else if (moduleName === '住房审批') {
        targetUrl = 'P38-housing-approval-list.html';
      } else if (moduleName === '白沙门审批') {
        targetUrl = 'P40-baishamen-approval-list.html';
      } else if (moduleName === '拜访审批') {
        targetUrl = 'P42-visit-approval-list.html';
      } else if (moduleName === '维护报修审批') {
        targetUrl = 'P50-maintenance-approval-list.html';
      }
      window.location.href = targetUrl;
    });
  });

  // Status bar time
  function updateStatusTime() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var el = document.querySelector('.status-bar .time');
    if (el) el.textContent = h + ':' + m;
  }
  updateStatusTime();
  setInterval(updateStatusTime, 60000);

})();
</script>
