/* ==================== 登录页专属样式 ==================== */
.miniprogram {
  background: var(--primary-gradient);
}

.login-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* 装饰圆 */
.deco-circle {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
  pointer-events: none;
}
.deco-circle.c1 { width: 200px; height: 200px; top: -60px; right: -50px; }
.deco-circle.c2 { width: 140px; height: 140px; top: 100px; left: -50px; }
.deco-circle.c3 { width: 300px; height: 300px; bottom: -100px; right: -100px; }

/* 品牌区 */
.brand-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 56px;
  position: relative;
  z-index: 2;
}
.brand-logo {
  width: 80px;
  height: 80px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
  margin-bottom: 16px;
}
.brand-logo svg { width: 44px; height: 44px; }
.brand-name {
  font-size: 19px;
  font-weight: 600;
  color: #FFFFFF;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.brand-sub {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.5px;
}

/* 欢迎语 */
.welcome-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
  padding: 0 40px;
}
.welcome-title {
  font-size: 32px;
  font-weight: 700;
  color: #FFFFFF;
  letter-spacing: 2px;
  margin-bottom: 12px;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
}
.welcome-desc {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.7);
  text-align: center;
  line-height: 1.8;
}

/* 特性图标 */
.feature-row {
  display: flex;
  gap: 32px;
  margin-top: 36px;
}
.feature-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.feature-icon {
  width: 44px;
  height: 44px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.15);
}
.feature-icon svg { width: 22px; height: 22px; color: #FFFFFF; }
.feature-label { font-size: 11px; color: rgba(255, 255, 255, 0.7); }

/* 底部登录区 */
.login-bottom {
  padding: 0 32px calc(32px + var(--safe-bottom));
  position: relative;
  z-index: 2;
}

/* 微信登录按钮 */
.btn-wechat {
  width: 100%;
  height: 48px;
  border: none;
  border-radius: 24px;
  background: linear-gradient(135deg, #07C160 0%, #06AD56 100%);
  color: #FFFFFF;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: inherit;
  box-shadow: 0 6px 20px rgba(7, 193, 96, 0.35);
  transition: transform 0.15s, opacity 0.2s;
}
.btn-wechat:active { transform: scale(0.98); opacity: 0.9; }
.btn-wechat svg { width: 22px; height: 22px; }

/* 协议勾选 */
.agreement-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 18px;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.7);
}
.agreement-row .checkbox {
  width: 16px;
  height: 16px;
  border: 1.5px solid rgba(255, 255, 255, 0.5);
  border-radius: 3px;
}
.agreement-row .checkbox.checked {
  background: #FFFFFF;
  border-color: #FFFFFF;
}
.agreement-row .checkbox.checked svg { color: var(--primary); }
.agreement-row .link {
  color: #FFFFFF;
  text-decoration: underline;
  text-decoration-color: rgba(255, 255, 255, 0.5);
}

/* 其他登录方式 */
.other-login {
  text-align: center;
  margin-top: 24px;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.5);
}

/* 底部版权 */
.copyright {
  text-align: center;
  font-size: 10px;
  color: rgba(255, 255, 255, 0.35);
  margin-top: 20px;
  line-height: 1.6;
}
</style>

<script>
(function() {
  'use strict';

  var agreed = false;

  // 协议勾选
  var checkbox = document.getElementById('agreeCheckbox');
  checkbox.addEventListener('click', function() {
    agreed = !agreed;
    if (agreed) {
      checkbox.classList.add('checked');
      checkbox.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    } else {
      checkbox.classList.remove('checked');
      checkbox.innerHTML = '';
    }
  });

  // 登录按钮
  document.getElementById('loginBtn').addEventListener('click', function() {
    if (!agreed) {
      MS.showToast('请先同意用户协议', 'error');
      return;
    }
    MS.showToast('正在调用微信授权登录...', 'info');
    setTimeout(function() {
      window.location.href = 'P02-phone-bind.html';
    }, 1500);
  });

  // 协议链接
  document.getElementById('userAgreement').addEventListener('click', function(e) {
    e.stopPropagation();
    MS.showToast('正在打开《用户协议》', 'info');
  });

  document.getElementById('privacyPolicy').addEventListener('click', function(e) {
    e.stopPropagation();
    MS.showToast('正在打开《隐私政策》', 'info');
  });

})();
</script>
