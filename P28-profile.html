/* ==================== 个人中心页专属样式 ==================== */
.profile-content {
  padding-bottom: 16px;
}

/* 用户信息头部 */
.profile-header {
  background: var(--primary-gradient);
  padding: 0 20px 24px;
  position: relative;
  overflow: hidden;
}
.profile-header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 20px;
  background: var(--bg);
  border-radius: 16px 16px 0 0;
}
/* 装饰圆 */
.profile-header::before {
  content: '';
  position: absolute;
  top: -40px;
  right: -30px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
}

.user-card {
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
  z-index: 2;
}
.user-avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(255, 255, 255, 0.3);
  flex-shrink: 0;
}
.user-avatar svg { width: 36px; height: 36px; color: #FFFFFF; }
.user-info { flex: 1; min-width: 0; }
.user-name {
  font-size: 20px;
  font-weight: 700;
  color: #FFFFFF;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.user-name .role-tag {
  font-size: 10px;
  font-weight: 500;
  padding: 2px 8px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  backdrop-filter: blur(4px);
}
.user-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.75);
  flex-wrap: wrap;
}
.user-meta .meta-divider {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.4);
}

/* 统计数据条 */
.user-stats {
  display: flex;
  gap: 0;
  margin-top: 16px;
  position: relative;
  z-index: 2;
}
.stat-item {
  flex: 1;
  text-align: center;
  position: relative;
}
.stat-item:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 1px;
  height: 24px;
  background: rgba(255, 255, 255, 0.2);
}
.stat-item .stat-num {
  font-size: 18px;
  font-weight: 700;
  color: #FFFFFF;
}
.stat-item .stat-label {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.7);
  margin-top: 2px;
}

/* 区块标题 */
.block-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
  padding: 16px 20px 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* 列表组 */
.list-group {
  background: var(--card-bg);
  margin: 0 16px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

/* 消息角标 */
.msg-badge {
  min-width: 18px;
  height: 18px;
  background: var(--badge);
  color: #FFFFFF;
  font-size: 11px;
  font-weight: 600;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 6px;
  flex-shrink: 0;
}

/* list-item icon 背景色 */
.li-icon-blue { background: linear-gradient(135deg, #48C9B0, #1ABC9C); }
.li-icon-orange { background: linear-gradient(135deg, #FFB443, #FF9800); }
.li-icon-purple { background: linear-gradient(135deg, #A569BD, #8E44AD); }
.li-icon-cyan { background: linear-gradient(135deg, #5DADE2, #3498DB); }
.li-icon-green { background: linear-gradient(135deg, #58D68D, #27AE60); }
.li-icon-red { background: linear-gradient(135deg, #FF7676, #FF5252); }
.li-icon-gray { background: linear-gradient(135deg, #BDC3C7, #95A5A6); }
</style>
