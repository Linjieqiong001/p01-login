.step-dot.inactive .dot-circle {

  color: var(--text-3);

.step-dot .dot-label {

<script>
(function() {
  'use strict';

  var phoneInput = document.getElementById('phoneInput');
  var codeInput = document.getElementById('codeInput');
  var getCodeBtn = document.getElementById('getCodeBtn');
  var confirmBtn = document.getElementById('confirmBtn');

  // 手机号输入限制
  phoneInput.addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 11);
  });

  // 验证码输入限制
  codeInput.addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
  });

  // 获取验证码
  getCodeBtn.addEventListener('click', function() {
    var phone = phoneInput.value.trim();
    if (!phone) {
      MS.showToast('请先输入手机号', 'error');
      phoneInput.focus();
      return;
    }
    if (!/^1[3-9]\d{9}$/.test(phone)) {
      MS.showToast('请输入正确的手机号', 'error');
      return;
    }
    MS.showToast('验证码已发送', 'success');
    MS.startCountdown(getCodeBtn, 60);
  });

  // 确认绑定
  confirmBtn.addEventListener('click', function() {
    var phone = phoneInput.value.trim();
    var code = codeInput.value.trim();

    if (!phone) {
      MS.showToast('请输入手机号', 'error');
      return;
    }
    if (!/^1[3-9]\d{9}$/.test(phone)) {
      MS.showToast('请输入正确的手机号', 'error');
      return;
    }
    if (!code) {
      MS.showToast('请输入验证码', 'error');
      return;
    }
    if (code.length < 6) {
      MS.showToast('请输入6位验证码', 'error');
      return;
    }
    MS.showToast('绑定成功，正在进入首页...', 'success');
    setTimeout(function() {
      window.location.href = 'haikou-maritime-home.html';
    }, 1500);
  });

})();
</script>
