<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P02 - 手机号绑定</title>
<link rel="stylesheet" href="common.css">
<style>
/* ==================== 手机号绑定页专属样式 ==================== */
.bind-content {
  padding-bottom: 80px;
}

/* 说明文案 */
.bind-desc {
  padding: 28px 20px 8px;
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.6;
}
.bind-desc .highlight {
  color: var(--primary);
  font-weight: 500;
}

/* 表单卡片 */
.form-card {
  background: var(--card-bg);
  margin: 12px 16px 0;
  border-radius: var(--radius-lg);
  padding: 4px 16px;
  box-shadow: var(--shadow-sm);
}

/* 验证码行 */
.code-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.code-row .form-input { flex: 1; }
.get-code-btn {
  flex-shrink: 0;
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--primary);
  background: var(--primary-light);
  color: var(--primary);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: all 0.2s;
}
.get-code-btn:active { opacity: 0.7; }
.get-code-btn.btn-disabled {
  border-color: var(--divider);
  background: var(--bg);
  color: var(--text-4);
}

/* 隐私提示 */
.privacy-tip {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 20px 20px 0;
  padding: 12px 14px;
  background: var(--primary-light);
  border-radius: var(--radius-md);
}
.privacy-tip svg {
  width: 16px;
  height: 16px;
  color: var(--primary);
  flex-shrink: 0;
  margin-top: 1px;
}
.privacy-tip .tip-text {
  font-size: 12px;
  color: var(--primary);
  line-height: 1.6;
}

/* 手机号前缀 */
.phone-prefix {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  color: var(--text-1);
  font-weight: 500;
  flex-shrink: 0;
}
.phone-prefix .prefix-num { font-size: 15px; }
.phone-prefix svg { width: 14px; height: 14px; color: var(--text-3); }

/* 步骤指示 */
.step-hint {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px 20px 0;
}
.step-dot {
  display: flex;
  align-items: center;
  gap: 6px;
}
.step-dot .dot-circle {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
}
.step-dot.active .dot-circle {
  background: var(--primary);
  color: #FFFFFF;
}
.step-dot.inactive .dot-circle {
  background: var(--divider);
  color: var(--text-3);
}
.step-dot .dot-label {
  font-size: 12px;
  color: var(--text-3);
}
.step-dot.active .dot-label { color: var(--primary); font-weight: 500; }
.step-line {
  width: 24px;
  height: 2px;
  background: var(--divider);
}
</style>
</head>
<body>
<div class="miniprogram">

  <!-- ==================== Status Bar ==================== -->
  <div class="status-bar light">
    <span class="time">09:38</span>
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33V20.67C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <!-- ==================== Nav Bar ==================== -->
  <div class="nav-bar white">
    <div class="nav-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </div>
    <span class="nav-title">手机号绑定</span>
    <span class="nav-placeholder"></span>
  </div>

  <!-- ==================== Content ==================== -->
  <div class="content">
    <div class="bind-content">

      <!-- 步骤指示 -->
      <div class="step-hint">
        <div class="step-dot active">
          <div class="dot-circle">1</div>
          <span class="dot-label">微信授权</span>
        </div>
        <div class="step-line"></div>
        <div class="step-dot active">
          <div class="dot-circle">2</div>
          <span class="dot-label">绑定手机号</span>
        </div>
        <div class="step-line"></div>
        <div class="step-dot inactive">
          <div class="dot-circle">3</div>
          <span class="dot-label">完成</span>
        </div>
      </div>

      <!-- 说明文案 -->
      <div class="bind-desc">
        首次登录需绑定手机号已完成身份验证<br>
        <span class="highlight">手机号将用于登录验证与消息通知</span>
      </div>

      <!-- 表单卡片 -->
      <div class="form-card">

        <!-- 手机号 -->
        <div class="form-item">
          <div class="phone-prefix">
            <span class="prefix-num">+86</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <input type="tel" class="form-input" id="phoneInput" placeholder="请输入手机号" maxlength="11" inputmode="numeric">
        </div>

        <!-- 验证码 -->
        <div class="form-item">
          <div class="form-label">
            <span class="required">*</span>验证码
          </div>
          <div class="code-row">
            <input type="text" class="form-input" id="codeInput" placeholder="请输入验证码" maxlength="6" inputmode="numeric">
            <button class="get-code-btn" id="getCodeBtn">获取验证码</button>
          </div>
        </div>

      </div>

      <!-- 隐私提示 -->
      <div class="privacy-tip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <div class="tip-text">您的手机号信息将严格保密，仅用于身份验证，不会用于其他用途。</div>
      </div>

    </div>

    <!-- 底部确认按钮 -->
    <div class="btn-fixed-bottom">
      <button class="btn btn-primary btn-block" id="confirmBtn">确认绑定</button>
    </div>

  </div>

</div>

<script src="common.js"></script>
<script>
(function() {
  'use strict';

  var phoneInput = document.getElementById('phoneInput');
  var codeInput = document.getElementById('codeInput');
  var getCodeBtn = document.getElementById('getCodeBtn');
  var confirmBtn = document.getElementById('confirmBtn');

  // 手机号输入限制
  phoneInput.addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 11);
  });

  // 验证码输入限制
  codeInput.addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
  });

  // 获取验证码
  getCodeBtn.addEventListener('click', function() {
    var phone = phoneInput.value.trim();
    if (!phone) {
      MS.showToast('请先输入手机号', 'error');
      phoneInput.focus();
      return;
    }
    if (!/^1[3-9]\d{9}$/.test(phone)) {
      MS.showToast('请输入正确的手机号', 'error');
      return;
    }
    MS.showToast('验证码已发送', 'success');
    MS.startCountdown(getCodeBtn, 60);
  });

  // 确认绑定
  confirmBtn.addEventListener('click', function() {
    var phone = phoneInput.value.trim();
    var code = codeInput.value.trim();

    if (!phone) {
      MS.showToast('请输入手机号', 'error');
      return;
    }
    if (!/^1[3-9]\d{9}$/.test(phone)) {
      MS.showToast('请输入正确的手机号', 'error');
      return;
    }
    if (!code) {
      MS.showToast('请输入验证码', 'error');
      return;
    }
    if (code.length < 6) {
      MS.showToast('请输入6位验证码', 'error');
      return;
    }
    MS.showToast('绑定成功，正在进入首页...', 'success');
    setTimeout(function() {
      window.location.href = 'haikou-maritime-home.html';
    }, 1500);
  });

})();
</script>
</body>
</html>
