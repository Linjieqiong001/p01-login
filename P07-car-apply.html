<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P07 - 用车申请</title>
<link rel="stylesheet" href="common.css">
<style>
.content { padding-bottom: 100px; }

/* Make inputs fill remaining space in flex form-item */
.form-item .form-input,
.form-item .form-textarea { flex: 1; }

/* Remove number input spinners */
.form-input[type="number"]::-webkit-outer-spin-button,
.form-input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.form-input[type="number"] { -moz-appearance: textfield; }

/* Clickable form items (date pickers) */
.form-item.clickable { cursor: pointer; transition: background 0.15s; }
.form-item.clickable:active { background: var(--bg); }

/* Textarea item alignment */
.form-item.textarea-item { align-items: flex-start; }
.form-item.textarea-item .form-label { padding-top: 4px; }

/* Notice tip */
.notice-tip {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 14px;
  margin: 12px 16px 0;
  background: var(--primary-light);
  border-radius: var(--radius-md);
  font-size: 12px;
  color: var(--primary);
  line-height: 1.5;
}
.notice-tip svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

/* Switch right alignment */
.switch-wrap { flex: 1; display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<div class="miniprogram">
  <!-- Status Bar -->
  <div class="status-bar light">
    <span class="time">09:38</span>
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33V20.67C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <!-- Navigation Bar -->
  <div class="nav-bar white">
    <div class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
    <span class="nav-title">用车申请</span>
    <span class="nav-right-btn" id="historyBtn">历史记录</span>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Notice -->
    <div class="notice-tip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span>请提前1个工作日提交用车申请，审批通过后将自动派车。</span>
    </div>

    <!-- Form Section -->
    <div class="section">
      <div class="section-title"><span class="dot"></span>用车信息</div>
      <div class="form-group">
        <!-- 用车事由 -->
        <div class="form-item textarea-item">
          <span class="form-label"><span class="required">*</span>用车事由</span>
          <textarea class="form-textarea" placeholder="请输入用车事由" rows="3"></textarea>
        </div>
        <!-- 用车开始时间 -->
        <div class="form-item clickable" id="startTime">
          <span class="form-label"><span class="required">*</span>开始时间</span>
          <span class="form-value form-placeholder">请选择日期时间</span>
          <svg class="form-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <!-- 用车结束时间 -->
        <div class="form-item clickable" id="endTime">
          <span class="form-label"><span class="required">*</span>结束时间</span>
          <span class="form-value form-placeholder">请选择日期时间</span>
          <svg class="form-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <!-- 出发地 -->
        <div class="form-item">
          <span class="form-label"><span class="required">*</span>出发地</span>
          <input class="form-input" placeholder="请输入出发地">
        </div>
        <!-- 目的地 -->
        <div class="form-item">
          <span class="form-label"><span class="required">*</span>目的地</span>
          <input class="form-input" placeholder="请输入目的地">
        </div>
        <!-- 乘车人数 -->
        <div class="form-item">
          <span class="form-label">乘车人数</span>
          <input class="form-input" type="number" placeholder="1">
          <span class="form-suffix">人</span>
        </div>
        <!-- 是否需要司机 -->
        <div class="form-item">
          <span class="form-label">需要司机</span>
          <div class="switch-wrap">
            <label class="switch">
              <input type="checkbox" checked>
              <span class="switch-slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div style="height: 12px;"></div>
  </div>

  <!-- Fixed Bottom Button -->
  <div class="btn-fixed-bottom">
    <button class="btn btn-primary btn-block" id="submitBtn">提交申请</button>
  </div>
</div>

<script src="common.js"></script>
<script>
(function() {
  'use strict';

  // 历史记录按钮
  document.getElementById('historyBtn').addEventListener('click', function() {
    window.location.href = 'P08-my-trips.html';
  });

  // 时间选择器（模拟）
  document.getElementById('startTime').addEventListener('click', function() {
    MS.showToast('请选择用车开始时间', 'info');
  });
  document.getElementById('endTime').addEventListener('click', function() {
    MS.showToast('请选择用车结束时间', 'info');
  });

  // 提交申请
  document.getElementById('submitBtn').addEventListener('click', function() {
    MS.showToast('申请已提交，等待审批', 'success');
  });
})();
</script>
</body>
</html>
