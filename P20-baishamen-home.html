<style>
/* ==================== 顶部Banner区 ==================== */
.bs-banner {
  margin: 12px 16px 0;
  height: 140px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  position: relative;
  background: linear-gradient(135deg, #1677FF 0%, #0052D9 100%);
  box-shadow: var(--shadow-md);
}
.bs-banner::before {
  content: '';
  position: absolute;
  top: -30px;
  right: -30px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
}
.bs-banner::after {
  content: '';
  position: absolute;
  bottom: -40px;
  left: -20px;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
}
.bs-banner-content {
  position: relative;
  z-index: 2;
  padding: 20px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.bs-banner-text { flex: 1; }
.bs-banner-tag {
  display: inline-block;
  padding: 3px 10px;
  background: rgba(255,255,255,0.22);
  border-radius: 12px;
  font-size: 11px;
  color: #FFFFFF;
  margin-bottom: 8px;
  backdrop-filter: blur(4px);
}
.bs-banner-title {
  font-size: 22px;
  font-weight: 700;
  color: #FFFFFF;
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.bs-banner-desc {
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  line-height: 1.5;
}
.bs-banner-icon {
  width: 80px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.bs-banner-icon svg { width: 80px; height: 80px; }

/* ==================== 功能宫格 ==================== */
.bs-grid {
  background: var(--card-bg);
  margin: 12px 16px 0;
  border-radius: var(--radius-lg);
  padding: 18px 12px;
  box-shadow: var(--shadow-sm);
}
.bs-grid-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
  padding: 0 4px 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.bs-grid-title .dot {
  width: 4px;
  height: 14px;
  background: var(--primary);
  border-radius: 2px;
}
.bs-grid-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.bs-grid-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 8px;
  background: var(--bg);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform 0.15s;
}
.bs-grid-item:active { transform: scale(0.96); }
.bs-grid-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.bs-grid-icon svg { width: 24px; height: 24px; }
.ic-room { background: linear-gradient(135deg, #4D9FFF, #1677FF); }
.ic-meeting { background: linear-gradient(135deg, #FF9F43, #FF7F1F); }
.ic-meal { background: linear-gradient(135deg, #FFD93D, #FFB800); }
.ic-record { background: linear-gradient(135deg, #5F27CD, #341F97); }
.bs-grid-label {
  font-size: 13px;
  color: var(--text-1);
  font-weight: 500;
}

/* ==================== 最新预订 ==================== */
.bs-section {
  background: var(--card-bg);
  margin: 12px 16px 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.bs-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 6px;
}
.bs-section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
  display: flex;
  align-items: center;
  gap: 6px;
}
.bs-section-title .dot {
  width: 4px;
  height: 14px;
  background: var(--primary);
  border-radius: 2px;
}

/* 预订卡片 */
.bs-booking-card {
  margin: 0 16px 10px;
  padding: 12px 14px;
  background: var(--bg);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform 0.15s;
}
.bs-booking-card:active { transform: scale(0.99); }
.bs-booking-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.bs-booking-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.bs-type-tag {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.bs-type-tag.room { background: var(--primary-light); color: var(--primary); }
.bs-type-tag.meeting { background: var(--warning-light); color: var(--warning); }
.bs-type-tag.meal { background: #FFF8E1; color: #F57C00; }
.bs-booking-no {
  font-size: 12px;
  color: var(--text-3);
  font-family: -apple-system, monospace;
}
.bs-booking-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.bs-booking-row {
  display: flex;
  font-size: 13px;
  line-height: 1.5;
}
.bs-booking-row .label {
  color: var(--text-3);
  min-width: 64px;
}
.bs-booking-row .value {
  color: var(--text-1);
  flex: 1;
}

/* 查看全部入口 */
.bs-view-all {
  padding: 10px 16px 14px;
  text-align: center;
  border-top: 0.5px solid var(--border);
}

/* ==================== 信息提示条 ==================== */
.bs-notice {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 16px 0;
  padding: 10px 14px;
  background: var(--primary-light);
  border-radius: var(--radius-md);
}
.bs-notice svg {
  width: 16px;
  height: 16px;
  color: var(--primary);
  flex-shrink: 0;
}
.bs-notice-text {
  font-size: 12px;
  color: var(--primary);
  flex: 1;
  line-height: 1.5;
}

/* ==================== 底部间距 ==================== */
.bs-bottom-spacer { height: 20px; }
</style>
