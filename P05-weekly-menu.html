.week-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 4px;
}
.week-bar .week-range {
  font-size: 13px;
  font-weight: 600;

}
.week-bar .week-no {

  border-radius: 20px;
  font-weight: 600;
}

/* ==================== 每日菜单图（16:9） ==================== */
.menu-day-card {
  margin: 12px 16px 0;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius-lg);
  overflow: hidden;
  position: relative;
  background: url('assets/menu-default-bg.png') center/cover;
  box-shadow: var(--shadow-sm);
}
.menu-day-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(160deg, rgba(8,42,30,0.62) 0%, rgba(6,34,24,0.72) 55%, rgba(4,26,18,0.85) 100%);
}
.menu-day-card:last-of-type { margin-bottom: 0; }

.mdc-inner {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  color: #FFFFFF;
  z-index: 1;
}
.mdc-header {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mdc-header .day-name {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
}
.mdc-header .day-date {
  font-size: 11px;
  color: rgba(255,255,255,0.92);
  background: rgba(255,255,255,0.18);
  border: 0.5px solid rgba(255,255,255,0.25);
  padding: 2px 10px;
  border-radius: 20px;
  letter-spacing: 0.5px;
}
.mdc-header .day-line {
  flex: 1;
  height: 0.5px;
  background: rgba(255,255,255,0.25);
}
.mdc-meals {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  margin-top: 4px;
}
.meal-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.meal-tag {
  flex-shrink: 0;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  color: #FFFFFF;
  padding: 3px 9px;
  border-radius: 4px;
  margin-top: 1px;
}
.meal-tag.breakfast { background: linear-gradient(135deg, #FFA940, #FA8C16); }
.meal-tag.lunch { background: linear-gradient(135deg, #36D399, #00A870); }
.meal-dishes {
  font-size: 12.5px;
  line-height: 1.55;
  color: rgba(255,255,255,0.96);
  text-shadow: 0 1px 2px rgba(0,0,0,0.35);
}

/* ==================== 底部说明 ==================== */
.menu-footnote {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 14px 16px 20px;
  font-size: 11px;
  color: var(--text-4);
}
.menu-footnote svg { width: 12px; height: 12px; flex-shrink: 0; }

        { day: '周三', date: '2026-09-09', breakfast: '肠粉 · 白粥 · 卤蛋 · 酸豆角', lunch: '口水鸡 · 蒸南瓜 · 蛋花汤 · 米饭' },
        { day: '周四', date: '2026-09-10', breakfast: '花卷 · 皮蛋瘦肉粥 · 咸鸭蛋', lunch: '红烧牛肉 · 拌豆芽 · 排骨汤 · 米饭' },
        { day: '周五', date: '2026-09-11', breakfast: '海南粉 · 豆浆 · 煮玉米', lunch: '酸菜鱼 · 炒苋菜 · 三鲜汤 · 米饭' }
      ]
    },
    {
      text: '2026年9月14日 - 9月18日', weekNum: 38,
      days: [
        { day: '周一', date: '2026-09-14', breakfast: '叉烧包 · 茶叶蛋 · 小米粥 · 拌小菜', lunch: '红烧排骨 · 清炒时蔬 · 紫菜蛋花汤 · 米饭' },
        { day: '周二', date: '2026-09-15', breakfast: '油条 · 现磨豆浆 · 煎蛋 · 咸菜', lunch: '糖醋里脊 · 蒜蓉西兰花 · 冬瓜排骨汤 · 米饭' },
        { day: '周三', date: '2026-09-16', breakfast: '肠粉 · 白粥 · 卤蛋 · 酸豆角', lunch: '清蒸鲈鱼 · 麻婆豆腐 · 番茄蛋汤 · 米饭' },

        { day: '周五', date: '2026-09-18', breakfast: '海南粉 · 豆浆 · 煮玉米', lunch: '梅菜扣肉 · 炒青菜 · 银耳莲子汤 · 米饭' }

    },
    {
      text: '2026年9月21日 - 9月25日', weekNum: 39,
      days: [

        { day: '周二', date: '2026-09-22', breakfast: '油条 · 现磨豆浆 · 煎蛋 · 咸菜', lunch: '鱼香肉丝 · 凉拌木耳 · 豆腐汤 · 米饭' },

        { day: '周四', date: '2026-09-24', breakfast: '花卷 · 皮蛋瘦肉粥 · 咸鸭蛋', lunch: '水煮牛肉 · 拌三丝 · 萝卜汤 · 米饭' },
        { day: '周五', date: '2026-09-25', breakfast: '海南粉 · 豆浆 · 煮玉米', lunch: '红烧肉 · 炒空心菜 · 酸辣汤 · 米饭' }
      ]
    }
  ];

  // ==================== 解析周参数（默认当前周） ====================
  var params = new URLSearchParams(window.location.search);
  var weekIdx = parseInt(params.get('week'), 10);
  if (isNaN(weekIdx) || weekIdx < 0 || weekIdx >= weekMenus.length) {
    weekIdx = 1;
  }
  var week = weekMenus[weekIdx];

  document.getElementById('weekRange').textContent = week.text;
  document.getElementById('weekNo').textContent = '第' + week.weekNum + '周';

  // ==================== 渲染每日菜单图 ====================
  var html = '';
  week.days.forEach(function(d) {
    html +=
      '<div class="menu-day-card">' +
        '<div class="mdc-inner">' +
          '<div class="mdc-header">' +
            '<span class="day-name">' + d.day + '</span>' +
            '<span class="day-date">' + d.date + '</span>' +
            '<span class="day-line"></span>' +
          '</div>' +
          '<div class="mdc-meals">' +
            '<div class="meal-row">' +
              '<span class="meal-tag breakfast">早餐</span>' +
              '<span class="meal-dishes">' + d.breakfast + '</span>' +
            '</div>' +
            '<div class="meal-row">' +
              '<span class="meal-tag lunch">午餐</span>' +
              '<span class="meal-dishes">' + d.lunch + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  });
  document.getElementById('dayCards').innerHTML = html;
})();
</script>
