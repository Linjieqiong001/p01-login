<script>
(function() {
  'use strict';

  /* ==================== Toast ==================== */
  var toastTimer = null;
  function showToast(text, iconType) {
    var toast = document.getElementById('toast');
    var toastText = document.getElementById('toastText');
    var toastIcon = toast.querySelector('.toast-icon');
    toastText.textContent = text;
    var iconHtml = '';
    if (iconType === 'success') {
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
    } else if (iconType === 'error') {
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
    } else {
      iconHtml = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
    }
    toastIcon.innerHTML = iconHtml;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 1800);
  }

  /* ==================== Modal Helpers ==================== */
  function showModal(id) {
    document.getElementById(id).classList.add('show');
  }
  function hideModal(id) {
    document.getElementById(id).classList.remove('show');
  }

  /* ==================== Approve Button ==================== */
  document.getElementById('btnApprove').addEventListener('click', function() {
    showModal('confirmModal');
  });

  document.getElementById('confirmApproveBtn').addEventListener('click', function() {
    hideModal('confirmModal');
    showToast('审批通过，已通知基地确认预订', 'success');
  });

  document.getElementById('confirmModal').addEventListener('click', function(e) {
    if (e.target === this) hideModal('confirmModal');
  });

  /* ==================== Reject Button ==================== */
  document.getElementById('btnReject').addEventListener('click', function() {
    document.getElementById('rejectReason').value = '';
    showModal('rejectModal');
  });

  document.getElementById('confirmRejectBtn').addEventListener('click', function() {
    var reason = document.getElementById('rejectReason').value.trim();
    if (!reason) {
      showToast('请填写驳回原因', 'error');
      return;
    }
    hideModal('rejectModal');
    showToast('已驳回该申请', 'info');
  });

  document.getElementById('rejectModal').addEventListener('click', function(e) {
    if (e.target === this) hideModal('rejectModal');
  });

  /* ==================== Status Bar Time ==================== */
  function updateStatusTime() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var el = document.querySelector('.status-bar .time');
    if (el) el.textContent = h + ':' + m;
  }
  updateStatusTime();
  setInterval(updateStatusTime, 60000);

})();
</script>
