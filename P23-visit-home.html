<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P23 - 拜访预约首页</title>
<link rel="stylesheet" href="common.css">
<style>
.entry-cards {
  display: flex;
  gap: 12px;
  padding: 16px;
}
.entry-card {
  flex: 1;
  border-radius: var(--radius-lg);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  transition: transform 0.15s;
  position: relative;
  overflow: hidden;
}
.entry-card:active { transform: scale(0.97); }
.entry-card.primary-card {
  background: var(--primary-gradient);
  color: #FFFFFF;
  box-shadow: 0 4px 12px rgba(22,119,255,0.3);
}
.entry-card.primary-card::before {
  content: '';
  position: absolute;
  top: -20px;
  right: -20px;
  width: 80px;
  height: 80px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.entry-card.primary-card::after {
  content: '';
  position: absolute;
  bottom: -30px;
  left: -20px;
  width: 60px;
  height: 60px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.entry-card.outline-card {
  background: var(--card-bg);
  border: 1.5px solid var(--primary);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}
.entry-card .entry-icon {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.entry-card .entry-icon svg { width: 36px; height: 36px; }
.entry-card.primary-card .entry-icon svg { color: #FFFFFF; }
.entry-card.outline-card .entry-icon svg { color: var(--primary); }
.entry-card .entry-title {
  font-size: 16px;
  font-weight: 600;
}
.entry-card .entry-desc {
  font-size: 12px;
  opacity: 0.85;
}

.today-visitors-card {
  background: var(--card-bg);
  margin: 0 16px;
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.today-visitors-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.today-visitors-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
  display: flex;
  align-items: center;
  gap: 8px;
}
.today-visitors-title .icon-wrap {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.today-visitors-title .icon-wrap svg { width: 18px; height: 18px; color: var(--primary); }
.today-visitors-stat {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  padding: 10px 14px;
  background: var(--primary-light);
  border-radius: var(--radius-md);
}
.today-visitors-stat .stat-icon {
  width: 36px;
  height: 36px;
  background: var(--primary-gradient);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.today-visitors-stat .stat-icon svg { width: 20px; height: 20px; color: #FFFFFF; }
.today-visitors-stat .stat-info { flex: 1; }
.today-visitors-stat .stat-label { font-size: 13px; color: var(--text-2); }
.today-visitors-stat .stat-num { font-size: 22px; font-weight: 700; color: var(--primary); }
.today-visitors-stat .stat-unit { font-size: 13px; color: var(--text-3); }

.visitor-preview-list {
  margin-top: 12px;
}
.visitor-preview-item {
  display: flex;
  align-items: center;
  padding: 8px 0;
  border-bottom: 0.5px solid var(--border);
  gap: 8px;
}
.visitor-preview-item:last-child { border-bottom: none; }
.visitor-preview-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}
.visitor-preview-info { flex: 1; }
.visitor-preview-name { font-size: 14px; font-weight: 500; color: var(--text-1); }
.visitor-preview-time { font-size: 12px; color: var(--text-3); }

.quick-tip {
  margin: 12px 16px;
  padding: 12px 16px;
  background: var(--primary-light);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  gap: 8px;
}
.quick-tip svg { width: 16px; height: 16px; color: var(--primary); flex-shrink: 0; }
.quick-tip span { font-size: 12px; color: var(--primary); line-height: 1.5; }
</style>
</head>
<body>
<div class="miniprogram">
  <div class="status-bar light"><span class="time">09:38</span><div class="icons"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33V20.67C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg></div></div>
  <div class="nav-bar white">
    <div class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
    <span class="nav-title">拜访预约</span>
    <span class="nav-placeholder"></span>
  </div>
  <div class="content">

    <!-- 入口区：两张大卡片 -->
    <div class="entry-cards">
      <!-- 访客预约 主按钮 -->
      <div class="entry-card primary-card" id="visitorBookingBtn">
        <div class="entry-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
          </svg>
        </div>
        <div class="entry-title">访客预约</div>
        <div class="entry-desc">预约来访人员</div>
      </div>
      <!-- 我的预约 入口 -->
      <div class="entry-card outline-card" id="myVisitBtn">
        <div class="entry-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <div class="entry-title">我的预约</div>
        <div class="entry-desc">查看预约记录</div>
      </div>
    </div>

    <!-- 提示信息 -->
    <div class="quick-tip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4M12 8h.01"/>
      </svg>
      <span>外来人员来访需提前预约，被访人确认后方可入内</span>
    </div>

    <!-- 今日访客名单卡片 -->
    <div class="today-visitors-card">
      <div class="today-visitors-header">
        <div class="today-visitors-title">
          <div class="icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
            </svg>
          </div>
          今日访客名单
        </div>
        <button class="btn btn-sm btn-outline" id="viewDetailBtn">查看详情</button>
      </div>

      <div class="today-visitors-stat">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
          </svg>
        </div>
        <div class="stat-info">
          <div class="stat-label">今日访客</div>
          <div class="stat-num">3 <span class="stat-unit">人</span></div>
        </div>
      </div>

      <div class="visitor-preview-list">
        <div class="visitor-preview-item">
          <div class="visitor-preview-avatar">李</div>
          <div class="visitor-preview-info">
            <div class="visitor-preview-name">李明</div>
            <div class="visitor-preview-time">14:00 来访 · 业务洽谈</div>
          </div>
        </div>
        <div class="visitor-preview-item">
          <div class="visitor-preview-avatar">王</div>
          <div class="visitor-preview-info">
            <div class="visitor-preview-name">王芳</div>
            <div class="visitor-preview-time">10:00 来访 · 合同签署</div>
          </div>
        </div>
        <div class="visitor-preview-item">
          <div class="visitor-preview-avatar">陈</div>
          <div class="visitor-preview-info">
            <div class="visitor-preview-name">陈建国</div>
            <div class="visitor-preview-time">15:30 来访 · 技术交流</div>
          </div>
        </div>
      </div>
    </div>

    <div style="height: 20px;"></div>
  </div>
</div>
<script src="common.js"></script>
<script>
document.getElementById('visitorBookingBtn').addEventListener('click', function() {
  window.location.href = 'P24-visitor-booking.html';
});
document.getElementById('myVisitBtn').addEventListener('click', function() {
  window.location.href = 'P25-my-visit-records.html';
});
document.getElementById('viewDetailBtn').addEventListener('click', function() {
  window.location.href = 'P33-visitor-list.html';
});
</script>
</body>
</html>
