<style>
/* ==================== 电子支付页专属样式 ==================== */
.payment-page {
  background: var(--primary-gradient);
}

/* 导航栏右侧图标组 */
.nav-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}
.nav-action-btn {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  transition: background 0.2s;
}
.nav-action-btn:active { background: rgba(255,255,255,0.15); }
.nav-action-btn svg { width: 20px; height: 20px; color: #FFFFFF; }

/* 内容区 */
.payment-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
}
.payment-content::-webkit-scrollbar { display: none; }

/* 付款二维码卡片 */
.pay-card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.pay-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 0.5px solid var(--border);
}
.pay-card-header .header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.pay-card-header .header-icon {
  width: 22px;
  height: 22px;
  color: var(--text-1);
}
.pay-card-header .header-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
}
.pay-card-header .refresh-btn {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  transition: background 0.2s;
  color: var(--text-3);
}
.pay-card-header .refresh-btn:active { background: var(--bg); }
.pay-card-header .refresh-btn svg { width: 18px; height: 18px; }

/* 二维码区域 */
.qr-area {
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.qr-wrap {
  width: 200px;
  height: 200px;
  padding: 12px;
  background: #FFFFFF;
  border-radius: var(--radius-sm);
  box-shadow: inset 0 0 0 1px var(--border);
}
.qr-wrap svg { display: block; width: 100%; height: 100%; }

/* 卡片底部说明 */
.pay-card-footer {
  padding: 12px 16px 16px;
  text-align: center;
  font-size: 12px;
  color: var(--text-3);
}

/* 下方功能入口 */
.payment-menu {
  margin-top: 16px;
}
.payment-menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  background: rgba(255,255,255,0.1);
  border-radius: var(--radius-lg);
  margin-bottom: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.payment-menu-item:active { background: rgba(255,255,255,0.16); }
.payment-menu-item .item-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.payment-menu-item .item-icon {
  width: 22px;
  height: 22px;
  color: #FFFFFF;
}
.payment-menu-item .item-text {
  font-size: 15px;
  font-weight: 500;
  color: #FFFFFF;
}
.payment-menu-item .item-action {
  font-size: 14px;
  font-weight: 500;
  color: #FFAB40;
}

/* 底部提示 */
.payment-tips {

  text-align: center;
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  line-height: 1.6;

/* 钱包操作按钮组（充值 / 退款） */
.item-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.item-action-btn {
  padding: 4px 14px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 500;

}
.item-action-btn:active { opacity: 0.72; }
.item-action-btn.recharge {

  color: #4A2C00;
}
.item-action-btn.refund {
  border: 1px solid rgba(255,255,255,0.5);
  color: #FFFFFF;
}

/* ==================== 充值 / 退款 bottom-sheet ==================== */
.amount-options {
  display: flex;
  flex-wrap: wrap;

.amount-opt {

.custom-amount {

<script>
(function() {
  'use strict';

  // 生成伪随机二维码图案（视觉逼真，非真实编码）
  function generateQRCode(seed) {
    var size = 25;
    var cell = 8;
    var rng = function(s) {
      return function() {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
    }(seed);

    var rects = [];

    // 定位角（左上、右上、左下）
    function drawFinder(x, y) {
      for (var i = 0; i < 7; i++) {
        for (var j = 0; j < 7; j++) {
          var fill = (i === 0 || i === 6 || j === 0 || j === 6) || (i >= 2 && i <= 4 && j >= 2 && j <= 4);
          if (fill) rects.push('<rect x="' + ((x + i) * cell) + '" y="' + ((y + j) * cell) + '" width="' + cell + '" height="' + cell + '" fill="#000000"/>');
        }
      }
    }
    drawFinder(0, 0);
    drawFinder(size - 7, 0);
    drawFinder(0, size - 7);

    // 随机数据区（避开定位角和分隔区）
    for (var r = 0; r < size; r++) {
      for (var c = 0; c < size; c++) {
        // 避开定位角区域
        if ((r < 8 && c < 8) || (r < 8 && c >= size - 8) || (r >= size - 8 && c < 8)) continue;
        // 模拟二维码的块状特征
        var threshold = 0.48;
        if (rng() < threshold) {
          rects.push('<rect x="' + (c * cell) + '" y="' + (r * cell) + '" width="' + cell + '" height="' + cell + '" fill="#000000"/>');
        }
      }
    }

    var svgSize = size * cell;
    return '<svg viewBox="0 0 ' + svgSize + ' ' + svgSize + '" xmlns="http://www.w3.org/2000/svg">' +
           '<rect width="' + svgSize + '" height="' + svgSize + '" fill="#FFFFFF"/>' +
           rects.join('') +
           '</svg>';
  }

  function renderQR(seed) {
    document.getElementById('qrWrap').innerHTML = generateQRCode(seed || Date.now());
  }

  // 初始渲染
  renderQR(20260902);

  // 返回
  document.getElementById('backBtn').addEventListener('click', function() {
    MS.goBack();
  });

  // 更多
  document.getElementById('moreBtn').addEventListener('click', function() {
    MS.showToast('更多功能', 'info');
  });

  // 扫码/识别
  document.getElementById('scanBtn').addEventListener('click', function() {
    MS.showToast('扫码识别', 'info');
  });

  // 刷新二维码
  document.getElementById('refreshQrBtn').addEventListener('click', function() {
    renderQR(Date.now());
    MS.showToast('二维码已刷新', 'success');
  });

  // ==================== 钱包余额 / 充值 / 退款 ====================
  var walletBalance = 0;
  var walletBalanceEl = document.getElementById('walletBalance');
  var refundAmountEl = document.getElementById('refundAmountText');

  function renderBalance() {
    var v = Math.round(walletBalance * 100) / 100;
    var txt = String(v);
    if (txt.indexOf('.') > -1) {
      txt = v.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    }
    walletBalanceEl.textContent = txt;
    refundAmountEl.textContent = txt;
  }

  // ---- 充值弹窗 ----
  var rechargeAction = document.getElementById('rechargeAction');
  var rechargeSheet = document.getElementById('rechargeSheet');
  var amountOpts = document.querySelectorAll('.amount-opt');
  var rechargeConfirmBtn = document.getElementById('rechargeConfirmBtn');
  var customAmountInput = document.getElementById('customAmount');
  var rechargeSelected = 50;

  function resetRechargeState() {
    amountOpts.forEach(function(o) { o.classList.remove('active'); });
    if (amountOpts.length) amountOpts[0].classList.add('active');
    rechargeSelected = 50;
    customAmountInput.value = '';
    rechargeConfirmBtn.textContent = '立即充值 ¥50';
  }

  rechargeAction.addEventListener('click', function(e) {
    e.stopPropagation();
    MS.showModal('rechargeSheet');
  });
  rechargeSheet.addEventListener('click', function(e) {
    if (e.target === rechargeSheet) MS.hideModal('rechargeSheet');
  });
  document.getElementById('rechargeCancelBtn').addEventListener('click', function() {
    MS.hideModal('rechargeSheet');
  });

  amountOpts.forEach(function(opt) {
    opt.addEventListener('click', function() {
      amountOpts.forEach(function(o) { o.classList.remove('active'); });
      this.classList.add('active');
      rechargeSelected = parseInt(this.getAttribute('data-amount'), 10);
      customAmountInput.value = '';
      rechargeConfirmBtn.textContent = '立即充值 ¥' + rechargeSelected;
    });
  });

  customAmountInput.addEventListener('input', function() {
    var val = this.value.trim();
    if (!val) {
      rechargeConfirmBtn.textContent = '立即充值 ¥' + rechargeSelected;
      return;
    }
    amountOpts.forEach(function(o) { o.classList.remove('active'); });
    var num = parseFloat(val);
    if (num > 0) {
      rechargeSelected = num;
      rechargeConfirmBtn.textContent = '立即充值 ¥' + (Math.round(num * 100) / 100);
    }
  });

  rechargeConfirmBtn.addEventListener('click', function() {
    if (!rechargeSelected || rechargeSelected <= 0) {
      MS.showToast('请输入充值金额', 'info');
      return;
    }
    if (rechargeSelected < 10 || rechargeSelected > 2000) {
      MS.showToast('充值金额需在10-2000元之间', 'info');
      return;
    }
    MS.hideModal('rechargeSheet');
    walletBalance = Math.round((walletBalance + rechargeSelected) * 100) / 100;
    renderBalance();
    resetRechargeState();
    MS.showToast('充值成功', 'success');
  });

  // ---- 退款弹窗（不可输入金额，默认退还当前全部余额） ----
  var refundAction = document.getElementById('refundAction');
  var refundSheet = document.getElementById('refundSheet');
  var reasonOpts = document.querySelectorAll('.refund-reason-opt');

  refundAction.addEventListener('click', function(e) {
    e.stopPropagation();
    renderBalance();
    MS.showModal('refundSheet');
  });
  refundSheet.addEventListener('click', function(e) {
    if (e.target === refundSheet) MS.hideModal('refundSheet');
  });
  document.getElementById('refundCancelBtn').addEventListener('click', function() {
    MS.hideModal('refundSheet');
  });

  reasonOpts.forEach(function(opt) {
    opt.addEventListener('click', function() {
      reasonOpts.forEach(function(o) { o.classList.remove('active'); });
      this.classList.add('active');
    });
  });

  document.getElementById('refundConfirmBtn').addEventListener('click', function() {
    if (walletBalance <= 0) {
      MS.showToast('当前无可退余额', 'error');
      return;
    }
    MS.hideModal('refundSheet');
    walletBalance = 0;
    renderBalance();
    // 重置表单
    reasonOpts.forEach(function(o, i) {
      o.classList.toggle('active', i === 0);
    });
    document.getElementById('refundRemark').value = '';
    MS.showToast('退款申请已提交，将全额退还', 'success');
  });

  // 消费记录 → 跳转账单明细页
  document.getElementById('recordBtn').addEventListener('click', function() {
    window.location.href = 'P06-wallet.html';
  });

})();
</script>
</body>
</html>
